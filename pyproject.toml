[project]
name = "cskge"
version = "0.1.0"
description = "Category-supplemented knowledge graph embedding experiments"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "class-resolver==0.5.2",
    "pandas==2.0.0",
    "torch==2.7.1",
    "tqdm==4.65.0",
    "pykeen==1.10.2",
    "scipy==1.10.1",
    "numpy==1.26.4",
    "setuptools==65.5.0",
]

[tool.uv]
package = false
python-preference = "only-managed"
cache-dir = ".cache/uv"
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

# Blackwell (sm_120) requires a CUDA 12.8 build.
[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
